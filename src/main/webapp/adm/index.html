<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal Nippon - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            padding-bottom: 80px;
            background-color: #030000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Remove o sublinhado dos links */
        .card-link {
            text-decoration: none !important;
            color: inherit;
        }

        /* Estilo dos Cards (Mesmo do sistema de estoque) */
        .card-sistema {
            border-radius: 18px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            min-height: 160px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card-sistema:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .card-sistema h5 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0;
        }

        /* Cores dos Sistemas */
        .bg-nippon { background-color: #ffbd00; color: #000; }
        .bg-ponto { background-color: #5a189a; }
        .bg-estoque { background-color: #00a6fb; }
        .bg-crediario { background-color: #dd1c1a; }

        /* Rodapé Estilizado */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-top: 1px solid #daa520;
            color: #fff;
            font-size: 13px;
            z-index: 1000;
        }
        .footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }
        .footer a:hover {
            color: #fff;
            text-shadow: 0 0 10px #daa520;
            text-decoration: underline;
        }

        /* Ajustes Mobile */
        @media (max-width: 768px) {
            .card-sistema { min-height: 140px; }
            .card-sistema h5 { font-size: 1.1rem; }
            .footer { font-size: 12px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h4 class="m-0 text-dark fw-bold">🇯🇵 Portal Nippon</h4>
        <small class="text-muted">Acesso Rápido</small>
    </div>

    <div class="row g-3">
        <div class="col-6">
            <a href="https://hashtag.app.br/nippon/index.jsp" class="card-link">
                <div class="card card-sistema bg-nippon">
                    <h5>📸 Nippon Photos</h5>
                </div>
            </a>
        </div>

        <div class="col-6">
            <a href="https://hashtag.app.br/nippon/ponto/index.jsp" class="card-link">
                <div class="card card-sistema bg-ponto">
                    <h5>⏰ Controle de Ponto</h5>
                </div>
            </a>
        </div>

        <div class="col-6">
            <a href="https://hashtag.app.br/nippon/estoque/index.jsp" class="card-link">
                <div class="card card-sistema bg-estoque">
                    <h5>📦 Controle de Estoque</h5>
                </div>
            </a>
        </div>

        <div class="col-6">
            <a href="https://hashtag.app.br/nippon/ServletCredQSD" class="card-link">
                <div class="card card-sistema bg-crediario">
                    <h5>💳 Crediário</h5>
                </div>
            </a>
        </div>
    </div>
</div>

<div class="footer">
    Desenvolvido por <a href="https://jeffconstantino.dev.br" target="_blank" rel="noopener">Jeff Constantino</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
